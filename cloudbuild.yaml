steps:
  # Step 0: Install deps and gate the deploy on lint + unit tests
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'lint']

  - name: 'node:20'
    entrypoint: npx
    args:
      - 'jest'
      # Excluded here, all for the same reason - they need live infrastructure
      # (a real MongoDB, full .env-sourced config) this fast pre-build gate
      # doesn't provision, so they'd fail here regardless of code correctness:
      #  - factories.test.ts: spins up mongodb-memory-server, which downloads
      #    a ~590MB binary on a cold cache.
      #  - tests/app.test.ts: boots the full Express app (real Mongo
      #    connection, JWT_SECRET/MONGO_URI etc. from .env, which only
      #    ts-node's `-r dotenv/config` loads - plain `jest` does not).
      # Covered by `npm run test:all` against a provisioned environment
      # instead. TODO: stand up a real integration-test lane (Mongo service +
      # injected secrets) rather than growing this exclusion list further.
      - '--testPathIgnorePatterns=integration|factories\.test\.ts|src[\\/]tests[\\/]app\.test\.ts'

  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_DEPLOY_REGION-docker.pkg.dev/$PROJECT_ID/infoverse/backend:$COMMIT_SHA', '.']

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_DEPLOY_REGION-docker.pkg.dev/$PROJECT_ID/infoverse/backend:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'infoverse-backend'
      - '--image'
      - '$_DEPLOY_REGION-docker.pkg.dev/$PROJECT_ID/infoverse/backend:$COMMIT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--quiet'

# Options to fix the logging error
options:
  logging: CLOUD_LOGGING_ONLY

# Substitutions allow you to change the region in the GCP UI without editing this file
substitutions:
  _DEPLOY_REGION: europe-west1
